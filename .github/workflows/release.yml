name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[gui,build]"

      # build.py fails before compiling if the tag doesn't match
      # pyproject.toml's version, and zips the build under dist/.
      - name: Build and zip standalone executable
        run: python scripts/build.py --release-tag "$env:GITHUB_REF_NAME"

      # Notes come from docs/releases/<tag>.md when it exists; the app's
      # update dialog shows them. Without one, fall back to GitHub's
      # generated notes (only a compare link, since nothing lands via PR).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          $notesArgs = @(if (Test-Path $notes) { "--notes-file", $notes } else { "--generate-notes" })
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist/*.zip).FullName --title "$env:GITHUB_REF_NAME" @notesArgs
